spring.application.name=ev3-backend

# Puerto de escucha (compatible con variable de entorno PORT en Render)
server.port=${PORT:8080}

# Base de Datos PostgreSQL (Neon / Render / Local)
# Si DB_URL viene de Neon, recuerda que debe comenzar con jdbc:postgresql:// y llevar ?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tienda_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# CORS Configuration (admite orígenes separados por coma o comodines)
cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
